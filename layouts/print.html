{{- $home := site.Home -}}
<!DOCTYPE html>
<html lang="{{ site.Language.Locale }}">
<head>
{{ partial "head.html" . }}
<meta name="robots" content="noindex">
<link rel="stylesheet" href="{{ "css/print.css" | relURL }}">
</head>
<body class="sheet">
<main id="resume">
  {{ partial "hero.html" . }}
  {{/* hero renders name/contact; drop body content before the first section */}}
  <div class="content">{{ $home.Content | replaceRE `(?s)^.*?(<h2 )` "${1}" | safeHTML }}</div>
</main>
</body>
</html>
